[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-source-identity-gate"
version = "0.2.0"
description = "AURA Source Identity Gate: source inventory, integrity verification, and evidence qualification."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AURA Project" }]
dependencies = ["pytest>=8", "urllib3==1.26.4"]

[project.scripts]
aura-source-identity = "aura_source_identity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aura_source_identity.runtime" = ["*.cjs", "*.mjs"]
