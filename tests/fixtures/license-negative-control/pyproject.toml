[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asig-license-negative-control-fixture"
version = "0.0.1"
description = "Synthetic metadata fixture for ASIG license-policy validation; not for distribution."
requires-python = ">=3.11"
# Use the legacy free-text License field deliberately for this synthetic
# fixture: the scanner must reject the declared GPLv3 family without relying
# on a classifier/PEP 639 metadata conflict during package build.
license = { text = "GNU General Public License v3 (GPLv3)" }

[tool.setuptools.packages.find]
where = ["src"]
