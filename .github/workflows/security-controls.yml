name: ASIG Security Controls

on:
  push:
    branches: [main, integration, "feat/**", "infra/**"]
  pull_request:
    branches: [main, integration]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: python,javascript-typescript
          build-mode: none
      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: "/language:python-javascript-typescript"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Scan full Git history (redacted)
        shell: bash
        run: |
          gitleaks detect --source . --redact --verbose --exit-code 2 --report-format sarif --report-path "$RUNNER_TEMP/gitleaks-full-history.sarif" --log-level info

  python-dependency-audit:
    name: python-dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install package and pinned vulnerability-audit tool in isolated environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .venv/bin/python -m pip install --disable-pip-version-check ".[canonical]" pip-audit==2.10.1
      - name: Resolve project dependencies including the canonical extra
        env:
          REPORT_PATH: ${{ runner.temp }}/asig-dependency-resolution.json
          REQUIREMENTS_PATH: ${{ runner.temp }}/asig-runtime-requirements.txt
        run: |
          set -euo pipefail
          python -m pip install --dry-run --ignore-installed --report "$REPORT_PATH" ".[canonical]"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          pinned = {}
          local_project = "aura-source-identity-gate"
          for item in report.get("install", []):
              metadata = item.get("metadata", {})
              name = metadata.get("name")
              version = metadata.get("version")
              if not isinstance(name, str) or not isinstance(version, str):
                  raise SystemExit("dependency resolution report has a missing name/version")
              normalized = name.lower().replace("_", "-").replace(".", "-")
              if normalized == local_project:
                  continue
              prior = pinned.get(normalized)
              if prior is not None and prior != (name, version):
                  raise SystemExit(f"conflicting resolved versions for {name}")
              pinned[normalized] = (name, version)
          if not pinned:
              raise SystemExit("dependency resolution report contained no external packages")
          lines = [f"{name}=={version}" for name, version in sorted(pinned.values(), key=lambda row: row[0].lower())]
          Path(os.environ["REQUIREMENTS_PATH"]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Generated {len(lines)} pinned runtime/extra dependency requirements.")
          PY
      - name: Audit project dependencies including canonical extra
        env:
          REQUIREMENTS_PATH: ${{ runner.temp }}/asig-runtime-requirements.txt
        run: .venv/bin/pip-audit --requirement "$REQUIREMENTS_PATH" --no-deps --strict --progress-spinner off
      # Keep the license gate inside this existing required status context:
      # ruleset 25306960 already requires python-dependency-audit. Do not change
      # the required-check contract just to run this validation-only negative control.
      - name: Install pinned license scanner in a separate isolated environment
        run: |
          python -m venv .license-venv
          .license-venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .license-venv/bin/python -m pip install --disable-pip-version-check ".[canonical]" pip-licenses==5.5.5
      - name: Install synthetic GPL fixture when present on a negative-control branch
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tests/fixtures/license-negative-control/pyproject.toml ]; then
            .license-venv/bin/python -m pip install --disable-pip-version-check --no-deps ./tests/fixtures/license-negative-control
          else
            echo "No synthetic license fixture present; auditing declared environment only."
          fi
      - name: Generate dependency license inventory
        run: .license-venv/bin/pip-licenses --from=mixed --ignore-packages aura-source-identity-gate --format=json --output-file="$RUNNER_TEMP/asig-license-inventory.json"
      - name: Enforce validation-only license policy
        run: .license-venv/bin/python scripts/check_license_policy.py --policy .github/license-policy.json --report "$RUNNER_TEMP/asig-license-inventory.json"
