name: ASIG Delegation & Integration Gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/ISSUE_TEMPLATE/project-delegation.yml"
      - ".github/workflows/delegation-integration-gate.yml"
      - "docs/PROJECT_DELEGATION_AND_UPSTREAM_WORKSPACE.md"
      - "docs/templates/project-delegation.template.json"
      - "governance/delegations/**"
      - "schemas/**"
      - "scripts/validate_project_delegations.py"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  push:
    branches: [main, "feat/**", "infra/**", "docs/**"]
    paths:
      - ".github/ISSUE_TEMPLATE/project-delegation.yml"
      - ".github/workflows/delegation-integration-gate.yml"
      - "docs/PROJECT_DELEGATION_AND_UPSTREAM_WORKSPACE.md"
      - "docs/templates/project-delegation.template.json"
      - "governance/delegations/**"
      - "schemas/**"
      - "scripts/validate_project_delegations.py"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asig-delegation-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delegation-contract:
    name: delegation-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Parse schema and template
        run: |
          python -m json.tool schemas/project-delegation.schema.json > /dev/null
          python -m json.tool docs/templates/project-delegation.template.json > /dev/null
      - name: Validate delegation records
        run: |
          python scripts/validate_project_delegations.py \
            --records-dir governance/delegations/records \
            --schema schemas/project-delegation.schema.json \
            --report "$RUNNER_TEMP/project-delegation-validation.json"
      - name: Upload validation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: asig-delegation-validation-${{ github.sha }}
          path: "$RUNNER_TEMP/project-delegation-validation.json"
          if-no-files-found: error
          retention-days: 14

  python-test-build:
    name: python-test-build (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build tooling and package
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip build
          python -m pip install --disable-pip-version-check .
      - name: Parse JSON contracts
        run: |
          python -m json.tool schemas/project-delegation.schema.json > /dev/null
          python -m json.tool docs/templates/project-delegation.template.json > /dev/null
      - name: Compile source, scripts, and tests
        run: python -m compileall -q src scripts tests
      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: |
          python -m build
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Upload distribution and checksums
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: asig-dist-and-checksums-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  runtime-adapter-integration:
    name: runtime-adapter-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Install ASIG
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check .
      - name: Run Python, Node, and Rust adapter contract tests
        run: python -m unittest discover -s tests -p "test_*runtime.py" -v
