name: ASIG Manifest Sign and Verify

on:
  push:
    branches: [main]
    paths:
      - "src/aura_source_identity/**"
      - "schemas/source-identity-manifest.schema.json"
      - "pyproject.toml"
      - ".github/workflows/manifest-sign-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-and-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ASIG with strict JCS support
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check ".[canonical]"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Capture JCS manifest outside the measured checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asig"
          aura-source-identity capture \
            --root . \
            --repository "$GITHUB_REPOSITORY" \
            --canonicalization rfc8785 \
            --output "$RUNNER_TEMP/asig/asig-manifest.json"

      - name: Sign manifest bytes with Cosign keyless signing
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "$RUNNER_TEMP/asig/asig-manifest.sigstore.json" \
            "$RUNNER_TEMP/asig/asig-manifest.json"

      - name: Verify Cosign bundle using exact workflow identity
        shell: bash
        env:
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          CERT_IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/manifest-sign-verify.yml@refs/heads/main"
          cosign verify-blob "$RUNNER_TEMP/asig/asig-manifest.json" \
            --bundle "$RUNNER_TEMP/asig/asig-manifest.sigstore.json" \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER"
          aura-source-identity verify \
            --root . \
            --manifest "$RUNNER_TEMP/asig/asig-manifest.json" \
            --require-signature \
            --signature-bundle "$RUNNER_TEMP/asig/asig-manifest.sigstore.json" \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
            --output "$RUNNER_TEMP/asig/cosign-verification.json"

      - name: Generate GitHub DSSE/SLSA artifact attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: "${{ runner.temp }}/asig/asig-manifest.json"
          show-summary: true

      - name: Verify GitHub DSSE/SLSA artifact attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "$RUNNER_TEMP/asig/asig-manifest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/manifest-sign-verify.yml"
          aura-source-identity verify \
            --root . \
            --manifest "$RUNNER_TEMP/asig/asig-manifest.json" \
            --require-signature \
            --signature-backend github-attestation \
            --attestation-repository "$GITHUB_REPOSITORY" \
            --attestation-signer-workflow "$GITHUB_REPOSITORY/.github/workflows/manifest-sign-verify.yml" \
            --output "$RUNNER_TEMP/asig/github-attestation-verification.json"

      - name: Upload signed manifest and verification reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: asig-signed-manifest-${{ github.sha }}
          path: |
            ${{ runner.temp }}/asig/asig-manifest.json
            ${{ runner.temp }}/asig/asig-manifest.sigstore.json
            ${{ runner.temp }}/asig/cosign-verification.json
            ${{ runner.temp }}/asig/github-attestation-verification.json
          if-no-files-found: error
          retention-days: 14
